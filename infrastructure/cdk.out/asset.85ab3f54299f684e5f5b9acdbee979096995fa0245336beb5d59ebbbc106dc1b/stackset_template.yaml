AWSTemplateFormatVersion: '2010-09-09'
Description: 'CostGuard Multi-Account StackSet Template for Organization-wide Deployment'

Parameters:
  ManagementAccountId:
    Type: String
    Description: 'AWS Account ID of the CostGuard management account'
    Default: '123456789012'  # Replace with actual management account ID
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: 'Must be a valid 12-digit AWS account ID'
  
  ExternalIdPrefix:
    Type: String
    Description: 'Prefix for external ID generation (account-specific suffix will be added)'
    Default: 'CostGuard-'
    MinLength: 4
    MaxLength: 32

Resources:
  CostGuardCrossAccountRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'CostGuardCrossAccountRole'
      Description: 'CostGuard Multi-Account cross-account role deployed via StackSet'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${ManagementAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Sub '${ExternalIdPrefix}${AWS::AccountId}'
      MaxSessionDuration: 3600  # 1 hour
      Policies:
        - PolicyName: 'CostGuardMultiAccountStackSetAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Cost Explorer permissions
              - Sid: 'CostExplorerReadAccess'
                Effect: Allow
                Action:
                  - 'ce:GetCostAndUsage'
                  - 'ce:GetCostForecast'
                  - 'ce:GetUsageForecast'
                  - 'ce:GetTags'
                  - 'ce:GetCostCategories'
                  - 'ce:ListCostCategoryDefinitions'
                Resource: '*'
              
              # CloudWatch permissions
              - Sid: 'CloudWatchReadAccess'
                Effect: Allow
                Action:
                  - 'cloudwatch:GetMetricStatistics'
                  - 'cloudwatch:GetMetricData'
                  - 'cloudwatch:ListMetrics'
                Resource: '*'
              
              # Resource tagging for cost allocation
              - Sid: 'ResourceTaggingReadAccess'
                Effect: Allow
                Action:
                  - 'tag:GetResources'
                  - 'tag:GetTagKeys'
                  - 'tag:GetTagValues'
                  - 'resource-groups:GetGroupQuery'
                  - 'resource-groups:GetGroup'
                Resource: '*'
              
              # Resource discovery for cost allocation
              - Sid: 'ResourceDiscoveryReadAccess'
                Effect: Allow
                Action:
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeVolumes'
                  - 'ec2:DescribeSnapshots'
                  - 'rds:DescribeDBInstances'
                  - 'rds:DescribeDBClusters'
                  - 'lambda:ListFunctions'
                  - 's3:ListAllMyBuckets'
                  - 's3:GetBucketTagging'
                  - 'dynamodb:ListTables'
                  - 'dynamodb:DescribeTable'
                Resource: '*'
              
              # Account information
              - Sid: 'AccountInfoAccess'
                Effect: Allow
                Action:
                  - 'sts:GetCallerIdentity'
                  - 'iam:GetAccountSummary'
                Resource: '*'
      
      Tags:
        - Key: 'Purpose'
          Value: 'CostGuard Multi-Account Cost Management'
        - Key: 'Phase'
          Value: 'Phase5'
        - Key: 'DeploymentMethod'
          Value: 'StackSet'
        - Key: 'ManagedBy'
          Value: 'CloudFormation-StackSet'
        - Key: 'CostGuard'
          Value: 'CrossAccountRole'

Outputs:
  RoleArn:
    Description: 'ARN of the CostGuard cross-account role'
    Value: !GetAtt CostGuardCrossAccountRole.Arn
  
  RoleName:
    Description: 'Name of the CostGuard cross-account role'
    Value: !Ref CostGuardCrossAccountRole
  
  ExternalId:
    Description: 'External ID used for role assumption'
    Value: !Sub '${ExternalIdPrefix}${AWS::AccountId}'
  
  AccountId:
    Description: 'AWS Account ID where this role is deployed'
    Value: !Ref 'AWS::AccountId'