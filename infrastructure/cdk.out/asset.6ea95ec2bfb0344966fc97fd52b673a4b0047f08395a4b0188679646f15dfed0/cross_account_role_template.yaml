AWSTemplateFormatVersion: '2010-09-09'
Description: 'CostGuard AI Cross-Account Role for Cost Data Collection'

Parameters:
  ManagementAccountId:
    Type: String
    Description: 'AWS Account ID of the CostGuard management account'
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: 'Must be a valid 12-digit AWS account ID'
  
  ExternalId:
    Type: String
    Description: 'External ID for secure role assumption (provided by CostGuard)'
    MinLength: 8
    MaxLength: 64
    AllowedPattern: '^[a-zA-Z0-9+=,.@:\/-]*$'
    ConstraintDescription: 'Must be between 8-64 characters'

Resources:
  CostGuardCollectorRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'CostGuardCollectorRole'
      Description: 'Allows CostGuard AI to collect cost data from this account'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${ManagementAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      MaxSessionDuration: 3600  # 1 hour
      Policies:
        - PolicyName: 'CostGuardCostExplorerAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: 'CostExplorerReadAccess'
                Effect: Allow
                Action:
                  - 'ce:GetCostAndUsage'
                  - 'ce:GetCostForecast'
                  - 'ce:GetTags'
                  - 'ce:GetCostCategories'
                Resource: '*'
              
              - Sid: 'CloudWatchReadAccess'
                Effect: Allow
                Action:
                  - 'cloudwatch:GetMetricStatistics'
                  - 'cloudwatch:ListMetrics'
                Resource: '*'
      
      Tags:
        - Key: 'Purpose'
          Value: 'CostGuard AI Cost Collection'
        - Key: 'ManagedBy'
          Value: 'CloudFormation'

Outputs:
  RoleArn:
    Description: 'ARN of the CostGuard collector role'
    Value: !GetAtt CostGuardCollectorRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'
  
  RoleName:
    Description: 'Name of the CostGuard collector role'
    Value: !Ref CostGuardCollectorRole
    Export:
      Name: !Sub '${AWS::StackName}-RoleName'
  
  ExternalId:
    Description: 'External ID used for role assumption'
    Value: !Ref ExternalId
