[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=src/autonomous
    --cov=src/autonomous_handler.py
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80
    --import-mode=importlib
markers =
    unit: Unit tests
    integration: Integration tests
    property: Property-based tests
